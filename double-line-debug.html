<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>二重描画の診断</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, 'Noto Sans JP', sans-serif; margin: 0;
         background: #fff; color: #1e293b; -webkit-user-select: none; user-select: none;
         display: flex; flex-direction: column; }
  header { padding: 8px 10px; border-bottom: 1px solid #cbd5e1; flex: 0 0 auto; }
  h1 { font-size: 13px; margin: 0 0 4px; }
  .note { font-size: 11px; color: #64748b; line-height: 1.5; margin: 0 0 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { padding: 7px 14px; border: 1px solid #000; background: #fff; font-size: 12px; }
  #legend { font-size: 11px; font-family: ui-monospace, monospace; line-height: 1.7; margin-top: 6px; }
  .sw { display: inline-block; width: 22px; height: 3px; vertical-align: 3px; margin-right: 5px; }
  #wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  #pad { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
         touch-action: none; background: #fff; }
  #verdict { font-size: 12px; font-weight: 700; margin-top: 5px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>二重描画の診断</h1>
  <p class="note">
    下の白い部分に、<b>2本に見える現象が出るまで</b>いつもどおり書いてください。<br>
    まとめて届く点を <b>2つの軌跡に分けて</b>描き分けます。
  </p>
  <div class="row">
    <button id="clear">消去してやり直す</button>
    <span id="stat" style="font-size:11px;color:#64748b"></span>
  </div>
  <div id="legend">
    <span class="sw" style="background:#000"></span>黒 = 各イベントの<b>最後以外</b>の点をつないだ線<br>
    <span class="sw" style="background:#2563eb"></span>青 = 各イベントの<b>最後の点だけ</b>をつないだ線
  </div>
  <div id="verdict"></div>
</header>

<div id="wrap"><canvas id="pad"></canvas></div>

<script>
(function () {
  var pad = document.getElementById('pad');
  var ctx = pad.getContext('2d');
  var wrap = document.getElementById('wrap');
  function $(id) { return document.getElementById(id); }

  var rect = null;
  function sizePad() {
    var dpr = window.devicePixelRatio || 1;
    rect = wrap.getBoundingClientRect();
    pad.width = rect.width * dpr;
    pad.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }
  sizePad();
  window.addEventListener('resize', sizePad);

  // 軌跡A = 各イベントの最後以外の点（細かいサンプル）
  // 軌跡B = 各イベントの最後の点だけ（イベント本体の位置）
  var A = null, B = null;
  var ids = {}, types = {};
  var events = 0, points = 0;
  var sepSum = 0, sepCount = 0, sepMax = 0;

  function clearAll() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, pad.width, pad.height);
    ctx.restore();
    A = null; B = null; ids = {}; types = {};
    events = 0; points = 0; sepSum = 0; sepCount = 0; sepMax = 0;
    $('verdict').textContent = '';
    $('stat').textContent = '';
  }
  $('clear').addEventListener('click', clearAll);

  function local(ev) {
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  }

  function seg(from, to, color, width) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
  }

  function render() {
    var idList = Object.keys(ids);
    $('stat').textContent =
      'イベント ' + events + ' 回 / 点 ' + points + ' 個' +
      (events ? '（1イベント ' + (points / events).toFixed(2) + ' 点）' : '') +
      ' / pointerId ' + idList.length + ' 種類 [' + idList.map(function (i) { return types[i]; }).join(',') + ']';

    var avg = sepCount ? (sepSum / sepCount) : 0;
    var v = '';
    if (events > 5) {
      v = '最後の点が、直前の細かい点からどれだけ離れているか: 平均 ' +
          avg.toFixed(1) + ' px / 最大 ' + sepMax.toFixed(1) + ' px' + String.fromCharCode(10);
      if (idList.length > 1) {
        v += '判定: pointerId が複数あります。そちらが原因です。';
      } else if (avg > 6) {
        v += '判定: 黒と青が離れて2本に見えるはずです。' +
             'イベント本体の位置が、まとめて届く細かい点の軌跡から外れています。';
      } else {
        v += '判定: 黒と青は重なっているはずです。原因は別にあります。';
      }
    }
    $('verdict').textContent = v;
  }

  pad.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    rect = wrap.getBoundingClientRect();
    var p = local(e);
    A = { x: p.x, y: p.y };
    B = { x: p.x, y: p.y };
    ids[e.pointerId] = true;
    types[e.pointerId] = e.pointerType;
    render();
  });

  pad.addEventListener('pointermove', function (e) {
    if (!A) return;
    e.preventDefault();
    rect = wrap.getBoundingClientRect();
    ids[e.pointerId] = true;
    types[e.pointerId] = e.pointerType;
    events++;

    var pts = null;
    if (e.getCoalescedEvents) { try { pts = e.getCoalescedEvents(); } catch (err) { pts = null; } }
    if (!pts || pts.length === 0) pts = [e];
    points += pts.length;

    // 最後の1点を除いた分を、黒の軌跡としてつなぐ
    var prevFine = null;
    for (var i = 0; i < pts.length - 1; i++) {
      var p = local(pts[i]);
      seg(A, p, '#000000', 2);
      A = p;
      prevFine = p;
    }

    // 最後の点だけを、青の軌跡としてつなぐ
    var lastP = local(pts[pts.length - 1]);
    seg(B, lastP, '#2563eb', 2);
    B = lastP;

    // 最後の点が、直前の細かい点からどれだけ離れているか
    if (prevFine) {
      var d = Math.sqrt((lastP.x - prevFine.x) * (lastP.x - prevFine.x) +
                        (lastP.y - prevFine.y) * (lastP.y - prevFine.y));
      sepSum += d; sepCount++;
      if (d > sepMax) sepMax = d;
    }

    render();
  });

  ['pointerup', 'pointercancel'].forEach(function (t) {
    window.addEventListener(t, function () { A = null; B = null; render(); });
  });
})();
</script>
</body>
</html>
