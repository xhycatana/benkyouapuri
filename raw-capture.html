<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>生データの記録</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, 'Noto Sans JP', sans-serif; margin: 0;
         background: #fff; color: #1e293b; -webkit-user-select: none; user-select: none;
         display: flex; flex-direction: column; }
  header { padding: 8px 10px; border-bottom: 1px solid #cbd5e1; flex: 0 0 auto; }
  h1 { font-size: 13px; margin: 0 0 4px; }
  .note { font-size: 11px; color: #64748b; line-height: 1.5; margin: 0 0 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { padding: 7px 14px; border: 1px solid #000; background: #fff; font-size: 12px; }
  label { font-size: 11px; }
  #stat { font-size: 11px; color: #64748b; font-family: ui-monospace, monospace; margin-top: 5px; line-height: 1.6; }
  #wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  #pad { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
         touch-action: none; background: #fff; }
  #out { flex: 0 0 auto; }
  textarea { width: 100%; height: 110px; font-family: ui-monospace, monospace; font-size: 10px;
             border: 0; border-top: 1px solid #cbd5e1; padding: 6px;
             -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>

<header>
  <h1>生データの記録</h1>
  <p class="note">
    白い部分に <b>1本だけ、いつも2本に見えるような線を書いて</b>ください。<br>
    <b>書いている間は何も描きません。</b>ペンを離した瞬間に、記録した座標を1回だけ線でつなぎます。
  </p>
  <div class="row">
    <button id="clear">消去してやり直す</button>
    <label><input type="checkbox" id="live"> 書いている間も描画する</label>
  </div>
  <div id="stat">まだ書かれていません</div>
</header>

<div id="wrap"><canvas id="pad"></canvas></div>

<div id="out"><textarea id="csv" readonly placeholder="ペンを離すと、ここに生の座標が出ます。全部コピーして貼り付けてください。"></textarea></div>

<script>
(function () {
  var pad = document.getElementById('pad');
  var ctx = pad.getContext('2d');
  var wrap = document.getElementById('wrap');
  var live = document.getElementById('live');
  var NL = String.fromCharCode(10);
  function $(id) { return document.getElementById(id); }

  var rect = null;
  function sizePad() {
    var dpr = window.devicePixelRatio || 1;
    rect = wrap.getBoundingClientRect();
    pad.width = rect.width * dpr;
    pad.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#000';
  }
  sizePad();
  window.addEventListener('resize', sizePad);

  var rec = [];        // { ev, i, n, x, y, t, id, type }
  var evCount = 0;
  var drawing = false;
  var liveLast = null;

  function clearAll() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, pad.width, pad.height);
    ctx.restore();
    rec = []; evCount = 0; drawing = false; liveLast = null;
    $('csv').value = '';
    $('stat').textContent = 'まだ書かれていません';
  }
  $('clear').addEventListener('click', clearAll);

  function local(ev) {
    return { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  }

  pad.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    rect = wrap.getBoundingClientRect();
    clearAll();
    drawing = true;
    var p = local(e);
    rec.push({ ev: 0, i: 0, n: 1, x: p.x, y: p.y, t: e.timeStamp, id: e.pointerId, type: e.pointerType });
    liveLast = p;
  });

  pad.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    e.preventDefault();
    rect = wrap.getBoundingClientRect();
    evCount++;

    var pts = null;
    if (e.getCoalescedEvents) { try { pts = e.getCoalescedEvents(); } catch (err) { pts = null; } }
    if (!pts || pts.length === 0) pts = [e];

    for (var i = 0; i < pts.length; i++) {
      var p = local(pts[i]);
      rec.push({ ev: evCount, i: i, n: pts.length, x: p.x, y: p.y,
                 t: pts[i].timeStamp, id: e.pointerId, type: e.pointerType });
      if (live.checked) {
        ctx.beginPath();
        ctx.moveTo(liveLast.x, liveLast.y);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        liveLast = p;
      }
    }
    $('stat').textContent = '記録中… イベント ' + evCount + ' 回 / 点 ' + rec.length + ' 個';
  });

  function finish() {
    if (!drawing) return;
    drawing = false;
    if (rec.length < 2) return;

    // ここで初めて、記録した点を順に1本の線としてつなぐ
    if (!live.checked) {
      ctx.strokeStyle = '#000';
      ctx.beginPath();
      ctx.moveTo(rec[0].x, rec[0].y);
      for (var i = 1; i < rec.length; i++) ctx.lineTo(rec[i].x, rec[i].y);
      ctx.stroke();
    }

    var ids = {}, types = {};
    for (var j = 0; j < rec.length; j++) { ids[rec[j].id] = 1; types[rec[j].type] = 1; }

    $('stat').textContent =
      '点 ' + rec.length + ' 個 / イベント ' + evCount + ' 回' +
      (evCount ? '（1イベント ' + ((rec.length - 1) / evCount).toFixed(2) + ' 点）' : '') +
      ' / pointerId ' + Object.keys(ids).length + ' 種類 [' + Object.keys(types).join(',') + ']' + NL +
      '書いている間は描画していません。この線が2本に見えるなら入力データの問題、1本なら描画コードの問題です。';

    // 生データを出す。多すぎると貼れないので先頭 220 点まで。
    // ここで失敗すると診断そのものができなくなるので、必ず何か出るようにする。
    try {
      var num = function (v, d) { return (typeof v === 'number' && isFinite(v)) ? v.toFixed(d) : '?'; };
      var cap = Math.min(rec.length, 220);
      var out = ['# 生データ  点=' + rec.length + ' イベント=' + evCount +
                 ' 画面=' + Math.round(rect.width) + 'x' + Math.round(rect.height) +
                 ' dpr=' + (window.devicePixelRatio || 1) + ' 先頭' + cap + '点',
                 '# ev,idx,n,x,y,t'];
      for (var k = 0; k < cap; k++) {
        var r = rec[k];
        out.push(r.ev + ',' + r.i + ',' + r.n + ',' +
                 num(r.x, 2) + ',' + num(r.y, 2) + ',' + num(r.t, 1));
      }
      $('csv').value = out.join(NL);
    } catch (err) {
      $('csv').value = '生データの書き出しに失敗しました: ' + (err && err.message ? err.message : err);
    }
  }

  ['pointerup', 'pointercancel'].forEach(function (t) {
    window.addEventListener(t, finish);
  });
})();
</script>
</body>
</html>
