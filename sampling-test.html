<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>入力サンプリング測定</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, 'Noto Sans JP', sans-serif; margin: 0; padding: 12px;
         background: #fff; color: #1e293b; -webkit-user-select: none; user-select: none; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; margin-bottom: 10px; }
  .cell { border: 1px solid #cbd5e1; padding: 6px 8px; }
  .k { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; }
  .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .v small { font-size: 11px; font-weight: 400; color: #64748b; }
  .ok { color: #15803d; font-weight: 700; }
  .ng { color: #b91c1c; font-weight: 700; }
  #pad { width: 100%; height: 300px; border: 2px solid #000; touch-action: none; display: block; background: #fff; }
  .note { font-size: 11px; color: #64748b; margin: 8px 0; line-height: 1.6; }
  button { padding: 8px 14px; border: 1px solid #000; background: #fff; font-size: 12px; }
  label { font-size: 12px; }
  #env { font-size: 10px; color: #64748b; word-break: break-all; line-height: 1.6;
         border-top: 1px solid #e2e8f0; padding-top: 8px; margin-top: 10px; }
</style>
</head>
<body>
<h1>入力サンプリング測定</h1>
<p class="note">下の枠内を <b>Apple Pencil で 2〜3 秒、素早くぐるぐる</b> と描いてください。ペンを離した時点の数値が結果です。</p>

<div class="grid">
  <div class="cell"><div class="k">入力デバイス</div><div class="v" id="ptype">-</div></div>
  <div class="cell"><div class="k">pointermove の頻度</div><div class="v" id="hz">-</div></div>
  <div class="cell"><div class="k">実際に取れた点</div><div class="v" id="shz">-</div></div>
  <div class="cell"><div class="k">1イベントあたりの点数</div><div class="v" id="per">-</div></div>
  <div class="cell"><div class="k">点の間隔 最小/中央/最大</div><div class="v" id="gap">-</div></div>
  <div class="cell"><div class="k">画面リフレッシュレート</div><div class="v" id="fps">測定中</div></div>
  <div class="cell"><div class="k">筆圧 最小〜最大</div><div class="v" id="press">-</div></div>
  <div class="cell"><div class="k">傾き altitude/azimuth</div><div class="v" id="tilt">-</div></div>
</div>

<canvas id="pad"></canvas>

<p class="note">
  <label><input type="checkbox" id="chk-draw" checked> 測定中にキャンバスへ描画する</label>
  ／ チェックを外すと、描画処理がイベント頻度を落としているかどうかが分かります。
</p>
<p><button id="reset">リセット</button></p>

<p class="note"><b>↓ この枠の中をすべてコピーして、そのまま貼り付けてください</b>（手で書き写すと丸め誤差が入ります）</p>
<textarea id="summary" readonly rows="16"
  style="width:100%;font-family:ui-monospace,monospace;font-size:11px;border:1px solid #cbd5e1;padding:8px;line-height:1.5;"></textarea>

<div id="env"></div>

<script>
(function () {
  var pad = document.getElementById('pad');
  var ctx = pad.getContext('2d');
  var chkDraw = document.getElementById('chk-draw');
  function $(id) { return document.getElementById(id); }

  var padRect = null;
  function sizePad() {
    var dpr = window.devicePixelRatio || 1;
    padRect = pad.getBoundingClientRect();
    pad.width = padRect.width * dpr;
    pad.height = padRect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#000';
  }
  sizePad();
  window.addEventListener('resize', sizePad);
  window.addEventListener('scroll', function () { padRect = pad.getBoundingClientRect(); });

  var hasCoalesced = typeof PointerEvent !== 'undefined' &&
                     typeof PointerEvent.prototype.getCoalescedEvents === 'function';
  var hasRawUpdate = ('onpointerrawupdate' in window);

  function mark(b) { return b ? '<span class="ok">対応</span>' : '<span class="ng">非対応</span>'; }

  $('env').innerHTML =
    'getCoalescedEvents(): ' + mark(hasCoalesced) +
    ' ／ pointerrawupdate: ' + mark(hasRawUpdate) +
    ' ／ セキュアコンテキスト(HTTPS): ' + mark(window.isSecureContext) +
    ' ／ プロトコル: ' + location.protocol +
    '<br>devicePixelRatio: ' + (window.devicePixelRatio || 1) +
    ' ／ 画面: ' + screen.width + ' x ' + screen.height +
    '<br>' + navigator.userAgent;

  var frames = 0, fpsStart = 0;
  function tick(t) {
    if (!fpsStart) fpsStart = t;
    frames++;
    if (t - fpsStart < 1500) {
      requestAnimationFrame(tick);
    } else {
      fpsValue = Math.round(frames / ((t - fpsStart) / 1000));
      $('fps').innerHTML = fpsValue + '<small> Hz</small>';
    }
  }
  requestAnimationFrame(tick);

  var drawing = false, moveTimes = [], sampleTimes = [], rawCount = 0;
  var pMin = 1, pMax = 0, lastAlt = null, lastAzi = null, lastX = 0, lastY = 0;
  var lastType = '-', fpsValue = '-', fracCoords = false;

  function reset() {
    drawing = false;
    moveTimes = []; sampleTimes = []; rawCount = 0;
    pMin = 1; pMax = 0; lastAlt = null; lastAzi = null;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, pad.width, pad.height);
    ctx.restore();
    ['ptype', 'hz', 'shz', 'per', 'gap', 'press', 'tilt'].forEach(function (id) {
      $(id).textContent = '-';
    });
    $('summary').value = '';
    fracCoords = false;
  }
  $('reset').addEventListener('click', reset);

  function median(a) {
    if (!a.length) return 0;
    var b = a.slice().sort(function (x, y) { return x - y; });
    return b[Math.floor(b.length / 2)];
  }

  function report() {
    if (moveTimes.length < 2) return;
    var span = (moveTimes[moveTimes.length - 1] - moveTimes[0]) / 1000;
    if (span <= 0) return;

    $('hz').innerHTML = Math.round((moveTimes.length - 1) / span) + '<small> 回/秒</small>';
    $('shz').innerHTML = Math.round((sampleTimes.length - 1) / span) + '<small> 点/秒</small>';
    $('per').textContent = (sampleTimes.length / moveTimes.length).toFixed(2);

    var gaps = [];
    for (var i = 1; i < sampleTimes.length; i++) {
      var g = sampleTimes[i] - sampleTimes[i - 1];
      if (g > 0) gaps.push(g);
    }
    if (gaps.length) {
      var mn = Math.min.apply(null, gaps), mx = Math.max.apply(null, gaps);
      $('gap').innerHTML = mn.toFixed(1) + ' / ' + median(gaps).toFixed(1) + ' / ' + mx.toFixed(1) + '<small> ms</small>';
    }
    $('press').textContent = (pMax > 0) ? (pMin.toFixed(3) + ' 〜 ' + pMax.toFixed(3)) : '取得できず';
    $('tilt').textContent = (lastAlt === null) ? '取得できず'
      : (lastAlt.toFixed(2) + ' / ' + (lastAzi === null ? '-' : lastAzi.toFixed(2)));

    // --- コピー用サマリー（手で書き写さずに済むように生の数値を出す） ---
    var edges = [0, 2, 4, 6, 8, 10, 12, 14, 17, 20, 25, 34, 1e9];
    var hist = [];
    for (var h = 0; h < edges.length - 1; h++) hist.push(0);
    for (var g2 = 0; g2 < gaps.length; g2++) {
      for (var b = 0; b < edges.length - 1; b++) {
        if (gaps[g2] >= edges[b] && gaps[g2] < edges[b + 1]) { hist[b]++; break; }
      }
    }
    var histLines = [];
    for (var b2 = 0; b2 < hist.length; b2++) {
      if (hist[b2] === 0) continue;
      var hi = (edges[b2 + 1] > 1e8) ? '+' : ('-' + edges[b2 + 1]);
      var pct = Math.round(hist[b2] / gaps.length * 100);
      histLines.push('  ' + (edges[b2] + hi + ' ms').padEnd(12) + String(hist[b2]).padStart(4) +
                     ' 点 (' + pct + '%) ' + new Array(Math.max(1, Math.round(pct / 3))).join('#'));
    }

    var avg = 0;
    for (var g3 = 0; g3 < gaps.length; g3++) avg += gaps[g3];
    avg = gaps.length ? (avg / gaps.length) : 0;

    var out = [];
    out.push('--- 入力サンプリング測定 ---');
    out.push('入力デバイス       : ' + lastType);
    out.push('描画あり           : ' + (chkDraw.checked ? 'YES' : 'NO'));
    out.push('計測時間           : ' + span.toFixed(3) + ' 秒');
    out.push('pointermove 回数   : ' + moveTimes.length);
    out.push('取得できた点の総数 : ' + sampleTimes.length);
    out.push('pointermove 頻度   : ' + ((moveTimes.length - 1) / span).toFixed(1) + ' 回/秒');
    out.push('点の取得頻度       : ' + ((sampleTimes.length - 1) / span).toFixed(1) + ' 点/秒');
    out.push('1イベントあたり点数: ' + (sampleTimes.length / moveTimes.length).toFixed(3));
    out.push('間隔 平均/中央     : ' + avg.toFixed(2) + ' / ' + median(gaps).toFixed(2) + ' ms');
    out.push('間隔 最小/最大     : ' + (gaps.length ? Math.min.apply(null, gaps).toFixed(2) : '-') +
             ' / ' + (gaps.length ? Math.max.apply(null, gaps).toFixed(2) : '-') + ' ms');
    out.push('間隔の分布:');
    out = out.concat(histLines);
    out.push('筆圧               : ' + (pMax > 0 ? pMin.toFixed(3) + ' - ' + pMax.toFixed(3) : '取得できず'));
    out.push('座標の小数点以下   : ' + (fracCoords ? 'あり（サブピクセル精度）' : 'なし（整数に丸められている）'));
    out.push('画面リフレッシュ   : ' + fpsValue + ' Hz');
    out.push('getCoalescedEvents : ' + (hasCoalesced ? '対応' : '非対応'));
    out.push('pointerrawupdate   : ' + (hasRawUpdate ? '対応 (発火 ' + rawCount + ' 回)' : '非対応'));
    out.push('isSecureContext    : ' + window.isSecureContext + ' (' + location.protocol + ')');
    out.push('devicePixelRatio   : ' + (window.devicePixelRatio || 1));
    out.push('UA                 : ' + navigator.userAgent);
    $('summary').value = out.join(String.fromCharCode(10));
  }

  pad.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    reset();
    padRect = pad.getBoundingClientRect();
    drawing = true;
    lastType = e.pointerType;
    $('ptype').textContent = e.pointerType;
    lastX = e.clientX; lastY = e.clientY;
    moveTimes.push(e.timeStamp);
    sampleTimes.push(e.timeStamp);
    try { pad.setPointerCapture(e.pointerId); } catch (err) {}
  });

  pad.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    e.preventDefault();
    moveTimes.push(e.timeStamp);

    var pts = null;
    if (hasCoalesced) {
      try { pts = e.getCoalescedEvents(); } catch (err) { pts = null; }
    }
    if (!pts || pts.length === 0) pts = [e];

    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      sampleTimes.push(p.timeStamp);

      if (typeof p.pressure === 'number' && p.pressure > 0) {
        if (p.pressure < pMin) pMin = p.pressure;
        if (p.pressure > pMax) pMax = p.pressure;
      }
      if (p.clientX % 1 !== 0 || p.clientY % 1 !== 0) fracCoords = true;
      if (typeof p.altitudeAngle === 'number') {
        lastAlt = p.altitudeAngle;
        lastAzi = (typeof p.azimuthAngle === 'number') ? p.azimuthAngle : null;
      }

      if (chkDraw.checked) {
        ctx.beginPath();
        ctx.moveTo(lastX - padRect.left, lastY - padRect.top);
        ctx.lineTo(p.clientX - padRect.left, p.clientY - padRect.top);
        ctx.stroke();
      }
      lastX = p.clientX;
      lastY = p.clientY;
    }
    report();
  });

  if (hasRawUpdate) {
    pad.addEventListener('pointerrawupdate', function () { rawCount++; });
  }

  ['pointerup', 'pointercancel'].forEach(function (t) {
    window.addEventListener(t, function () {
      if (drawing) { drawing = false; report(); }
    });
  });
})();
</script>
</body>
</html>
