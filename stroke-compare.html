<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>描画方式の比較</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, 'Noto Sans JP', sans-serif; margin: 0; padding: 8px;
         background: #fff; color: #1e293b; -webkit-user-select: none; user-select: none;
         display: flex; flex-direction: column; }
  header { flex: 0 0 auto; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 13px; margin: 0; }
  .note { font-size: 11px; color: #64748b; margin: 4px 0 6px; line-height: 1.5; }
  button { padding: 7px 14px; border: 1px solid #000; background: #fff; font-size: 12px; }
  select { padding: 6px; border: 1px solid #000; background: #fff; font-size: 12px; }
  label { font-size: 11px; }
  #stat { font-size: 11px; color: #64748b; font-variant-numeric: tabular-nums; }

  #grid { flex: 1 1 auto; min-height: 0; display: grid;
          grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; }
  .panel { position: relative; min-height: 0; min-width: 0; }
  .cap { position: absolute; top: 3px; left: 6px; right: 6px; z-index: 2; pointer-events: none;
         font-size: 10px; font-weight: 700; display: flex; justify-content: space-between; }
  .cap .sub { font-weight: 400; color: #94a3b8; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
           touch-action: none; background: #fff; border: 1px solid #cbd5e1; }
  #c0 { border: 2px solid #000; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1>描画方式の比較</h1>
    <label>線の太さ
      <select id="width">
        <option value="1.0">極細</option>
        <option value="1.35">細</option>
        <option value="1.75" selected>普通（アプリの初期値）</option>
        <option value="3.5">太</option>
        <option value="6.0">極太</option>
      </select>
    </label>
    <button id="clear">消去</button>
    <span id="stat">-</span>
  </div>
  <p class="note">
    <b>左上の太枠に</b>、ゆっくりした線と速く払う線の両方を入れて書いてください。
    同じ筆跡が4方式で同時に描かれます。ページはスクロールしません。
  </p>
</header>

<div id="grid">
  <div class="panel">
    <div class="cap"><span>① 生データを直線で結ぶ（ここに書く）</span><span class="sub">補間なし</span></div>
    <canvas id="c0"></canvas>
  </div>
  <div class="panel">
    <div class="cap"><span>② ベジェ中点補間</span><span class="sub">現在のアプリ</span></div>
    <canvas id="c1"></canvas>
  </div>
  <div class="panel">
    <div class="cap"><span>③ Catmull-Rom スプライン</span><span class="sub">実際の点を必ず通る</span></div>
    <canvas id="c2"></canvas>
  </div>
  <div class="panel">
    <div class="cap"><span>④ 1イベント1点＋直線</span><span class="sub">60Hz相当・参考</span></div>
    <canvas id="c3"></canvas>
  </div>
</div>

<script>
(function () {
  var ids = ['c0', 'c1', 'c2', 'c3'];
  var cvs = [], ctxs = [];
  var widthSel = document.getElementById('width');
  var stat = document.getElementById('stat');
  var penWidth = parseFloat(widthSel.value);
  var rect0 = null;

  for (var i = 0; i < ids.length; i++) {
    var c = document.getElementById(ids[i]);
    cvs.push(c);
    ctxs.push(c.getContext('2d'));
  }

  function sizeAll() {
    var dpr = window.devicePixelRatio || 1;
    for (var i = 0; i < cvs.length; i++) {
      var r = cvs[i].getBoundingClientRect();
      cvs[i].width = Math.max(1, r.width * dpr);
      cvs[i].height = Math.max(1, r.height * dpr);
      var x = ctxs[i];
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      x.lineCap = 'round';
      x.lineJoin = 'round';
      x.lineWidth = penWidth;
      x.strokeStyle = '#000';
    }
    rect0 = cvs[0].getBoundingClientRect();
  }
  sizeAll();
  window.addEventListener('resize', sizeAll);

  widthSel.addEventListener('change', function () {
    penWidth = parseFloat(widthSel.value);
    for (var i = 0; i < ctxs.length; i++) ctxs[i].lineWidth = penWidth;
  });

  var hasCoalesced = typeof PointerEvent !== 'undefined' &&
                     typeof PointerEvent.prototype.getCoalescedEvents === 'function';

  var drawing = false;
  var totalPts = 0, dropped = 0;
  // Safari は同じ点の並びを2回配信してくる（実機で確認）。
  // そのまま繋ぐと数点ぶん巻き戻る直線が引かれ、二重線になる。
  var lastT = null, lastPX = null, lastPY = null;
  var sA = null, sB = null, sC = null, sD = null;

  function clearAll() {
    for (var i = 0; i < ctxs.length; i++) {
      ctxs[i].save();
      ctxs[i].setTransform(1, 0, 0, 1, 0, 0);
      ctxs[i].clearRect(0, 0, cvs[i].width, cvs[i].height);
      ctxs[i].restore();
    }
    totalPts = 0; dropped = 0;
    lastT = null; lastPX = null; lastPY = null;
    sA = sB = sC = sD = null;
    stat.textContent = '-';
  }
  document.getElementById('clear').addEventListener('click', clearAll);

  // ---- ① 生データを直線で結ぶ ----
  function beginA(p) { sA = { x: p.x, y: p.y }; }
  function stepA(p) {
    var x = ctxs[0];
    x.beginPath(); x.moveTo(sA.x, sA.y); x.lineTo(p.x, p.y); x.stroke();
    sA.x = p.x; sA.y = p.y;
  }

  // ---- ② ベジェ中点補間（現在のアプリと同じ） ----
  function beginB(p) { sB = { lastX: p.x, lastY: p.y, midX: p.x, midY: p.y }; }
  function stepB(p) {
    var x = ctxs[1];
    var mx = (sB.lastX + p.x) / 2, my = (sB.lastY + p.y) / 2;
    x.beginPath();
    x.moveTo(sB.midX, sB.midY);
    x.quadraticCurveTo(sB.lastX, sB.lastY, mx, my);
    x.stroke();
    sB.midX = mx; sB.midY = my; sB.lastX = p.x; sB.lastY = p.y;
  }
  function endB() {
    if (!sB) return;
    if (sB.midX !== sB.lastX || sB.midY !== sB.lastY) {
      var x = ctxs[1];
      x.beginPath(); x.moveTo(sB.midX, sB.midY); x.lineTo(sB.lastX, sB.lastY); x.stroke();
    }
    sB = null;
  }

  // ---- ③ Catmull-Rom スプライン ----
  // 直近4点 p0,p1,p2,p3 から p1→p2 の区間を描く。p1 と p2 を必ず通るので、
  // 実際に測れた座標が動かない（角が丸まらない）のが中点補間との違い。
  function beginC(p) { sC = { pts: [{ x: p.x, y: p.y }] }; }
  function segC(p0, p1, p2, p3) {
    var x = ctxs[2];
    x.beginPath();
    x.moveTo(p1.x, p1.y);
    x.bezierCurveTo(
      p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6,
      p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6,
      p2.x, p2.y
    );
    x.stroke();
  }
  function stepC(p) {
    sC.pts.push({ x: p.x, y: p.y });
    var n = sC.pts.length;
    if (n === 2) {
      var x = ctxs[2];
      x.beginPath(); x.moveTo(sC.pts[0].x, sC.pts[0].y); x.lineTo(sC.pts[1].x, sC.pts[1].y); x.stroke();
    } else if (n === 3) {
      segC(sC.pts[0], sC.pts[0], sC.pts[1], sC.pts[2]);
    } else {
      segC(sC.pts[n - 4], sC.pts[n - 3], sC.pts[n - 2], sC.pts[n - 1]);
    }
    if (sC.pts.length > 4) sC.pts.shift();
  }
  function endC() {
    if (!sC) return;
    var n = sC.pts.length;
    if (n >= 3) segC(sC.pts[n - 3], sC.pts[n - 2], sC.pts[n - 1], sC.pts[n - 1]);
    sC = null;
  }

  // ---- ④ 1イベント1点＋直線 ----
  function beginD(p) { sD = { x: p.x, y: p.y }; }
  function stepD(p) {
    var x = ctxs[3];
    x.beginPath(); x.moveTo(sD.x, sD.y); x.lineTo(p.x, p.y); x.stroke();
    sD.x = p.x; sD.y = p.y;
  }

  function toLocal(ev) {
    return { x: ev.clientX - rect0.left, y: ev.clientY - rect0.top };
  }

  cvs[0].addEventListener('pointerdown', function (e) {
    e.preventDefault();
    rect0 = cvs[0].getBoundingClientRect();
    drawing = true;
    lastT = (typeof e.timeStamp === 'number') ? e.timeStamp : null;
    lastPX = e.clientX; lastPY = e.clientY;
    var p = toLocal(e);
    beginA(p); beginB(p); beginC(p); beginD(p);
    try { cvs[0].setPointerCapture(e.pointerId); } catch (err) {}
  });

  cvs[0].addEventListener('pointermove', function (e) {
    if (!drawing) return;
    e.preventDefault();
    rect0 = cvs[0].getBoundingClientRect();

    var pts = null;
    if (hasCoalesced) {
      try { pts = e.getCoalescedEvents(); } catch (err) { pts = null; }
    }
    if (!pts || pts.length === 0) pts = [e];

    // 再配信された点を除外する（アプリ本体と同じ処理）
    var fresh = [];
    for (var i = 0; i < pts.length; i++) {
      var q = pts[i];
      var qt = q.timeStamp;
      if (typeof qt === 'number' && typeof lastT === 'number') {
        if (qt < lastT) { dropped++; continue; }
        if (qt === lastT && q.clientX === lastPX && q.clientY === lastPY) { dropped++; continue; }
      } else if (q.clientX === lastPX && q.clientY === lastPY) {
        dropped++; continue;
      }
      fresh.push(q);
      if (typeof qt === 'number') lastT = qt;
      lastPX = q.clientX; lastPY = q.clientY;
    }
    if (fresh.length === 0) return;

    for (var j = 0; j < fresh.length; j++) {
      var p = toLocal(fresh[j]);
      stepA(p); stepB(p); stepC(p);
      totalPts++;
    }
    stepD(toLocal(fresh[fresh.length - 1]));

    stat.textContent = '点 ' + totalPts + ' 個 / 再配信を除外 ' + dropped + ' 点';
  });

  ['pointerup', 'pointercancel'].forEach(function (t) {
    window.addEventListener(t, function () {
      if (!drawing) return;
      drawing = false;
      endB(); endC();
      sA = null; sD = null;
    });
  });
})();
</script>
</body>
</html>
